[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.2.0"
description = "能自己把活干完的 coding agent：改代码 → 跑测试 → 推 agent/* 分支 → 开 PR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "coding-agent", "llm", "devops", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# 依赖是从**实际 import** 反推出来的，不是抄某个旧的 dist-info
# （那个 dist-info 里混着 torch / langchain / sentence-transformers，
# 本项目一个都没用）。
dependencies = [
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
    "mcp>=1.12.0",
    "openai>=1.60.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
mewcode = "mewcode.__main__:main"

[project.urls]
Repository = "https://github.com/wsxhyit-code/Shipwright"
Issues = "https://github.com/wsxhyit-code/Shipwright/issues"

# ---------------------------------------------------------------------------
# 布局：**仓库根目录就是包根**
#
# 这是本仓库的特殊之处 —— `__init__.py` 就在仓库根，`tools/`、`hooks/`
# 这些子包也都在根目录下，源码里一律写 `from mewcode.tools import ...`。
#
# 所以要让别人 clone 下来就能装，必须显式声明映射：
#     package-dir = {"mewcode": "."}
# 意思是"叫 `mewcode` 的那个包，内容在仓库根"。
#
# ⚠️⚠️ 这里**刻意不用 `[tool.setuptools.packages.find]`**。
#     第一次就是用它写坏的：`find` 会覆盖 package-dir 映射，
#     在仓库根扫出来的"顶层包"是 `agents` / `tools` / `hooks` 这些，
#     而不是 `mewcode.*` —— 于是打出来的 wheel 里文件直接躺在
#     site-packages 根目录下，**`import mewcode` 根本不存在**，
#     console_scripts 入口也是死的。
#     它还会把 `build/`（构建残留）一起当成包打进去。
#     实测：修之前那个 wheel 有 256 个文件来自 `build/`。
#     所以包清单必须**显式列出**。
#
# ⚠️ 这样 `pip install` 能装，但**直接从源码跑仍然要求目录名是 `mewcode`**：
#    `python -m mewcode` 靠的是父目录在 sys.path 上。
#    想彻底摆脱这个限制，得把源码挪进 `src/mewcode/` —— 那是一次大搬迁，
#    会动到所有相对路径、.pth、文档和 CI，目前没做。
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "mewcode" = "." }
include-package-data = true
packages = [
    "mewcode",
    "mewcode.agents",
    "mewcode.agents.builtins",
    "mewcode.commands",
    "mewcode.commands.handlers",
    "mewcode.context",
    "mewcode.filehistory",
    "mewcode.hooks",
    "mewcode.mcpclient",
    "mewcode.memory",
    "mewcode.permissions",
    "mewcode.skills",
    "mewcode.skills.builtins",
    "mewcode.skills.builtins.backend-interview",
    "mewcode.skills.builtins.commit",
    "mewcode.skills.builtins.review",
    "mewcode.skills.builtins.test",
    "mewcode.teams",
    "mewcode.tools",
    "mewcode.tools.impl",
    "mewcode.tools.ops",
    "mewcode.tools.ops.backends",
    "mewcode.worktree",
]

# ---------------------------------------------------------------------------
# 包数据：运行时真的会读的非 .py 文件
#
#  · styles.tcss              —— app.py 的 CSS_PATH，Textual 界面样式
#  · skills/builtins/**       —— 内置 skill 的 SKILL.md / tool.json / 参考资料
# ---------------------------------------------------------------------------
[tool.setuptools.package-data]
"*" = ["SKILL.md", "tool.json", "references/*.py", "*.tcss"]
mewcode = ["styles.tcss"]
"mewcode.skills.builtins" = ["**/*.md", "**/*.json", "**/*.py"]

# 注意：pytest 的配置**只在 pytest.ini 里**。
# 不放 [tool.pytest.ini_options] —— pytest.ini 的优先级更高，两处都写
# 等于 pyproject 里那份永远不生效，改起来会白改一遍。
